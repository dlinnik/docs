services:
  docs:
    build: .
    container_name: databird-docs
    ports:
      # Порт наружу можно изменить через .env: DOCS_PORT=8081
      - "${DOCS_PORT:-7080}:3000"
    volumes:
      # Корень репозитория монтируется как read-only.
      # После git pull обновлённые доки видны сразу, без пересборки образа.
      - ..:/app/docs:ro
    restart: unless-stopped